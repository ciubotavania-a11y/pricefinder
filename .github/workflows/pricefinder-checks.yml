name: PriceFinder checks and authorized feed sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pricefinder-redesign]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      ADMIN_EMAIL: admin@example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check lint
        run: npm run lint
      - name: Check feed sync syntax
        run: node --check scripts/sync-feeds.mjs
      - name: Build application
        run: npm run build

  sync-feeds:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize feeds explicitly authorized by retailers
        run: npm run sync:feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
